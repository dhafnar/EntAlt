name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Run unit tests, lint, and build APKs
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:testOptimizedUnitTest :app:lintDebug :app:lintOptimized :app:assembleDebug :app:assembleOptimized
